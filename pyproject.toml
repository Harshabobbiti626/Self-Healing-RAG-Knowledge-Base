[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-rag"
version = "0.1.0"
description = "Production-Grade Self-Healing RAG Knowledge Base with Fast-Loop Query Correction and Slow-Loop Autonomous KB Curation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Knowledge AI Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
